; Static Catppuccin configuration for the standalone bspwm session.
; It never rewrites this checkout; hardware-dependent modules are selected by
; scripts/launch-polybar through environment variables.

include-file = ./colors.ini
include-file = ./modules.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 34
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${color.BACKGROUND}
foreground = ${color.FOREGROUND}

line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = JetBrains Mono:style=Medium:size=10;3
font-1 = Symbols Nerd Font Mono:size=11;3

modules-left = ${env:BSPWM_POLYBAR_LEFT:menu recording player nightlight idle-inhibitor}
modules-center = ${env:BSPWM_POLYBAR_CENTER:bspwm tray}
modules-right = ${env:BSPWM_POLYBAR_RIGHT:pulseaudio memory xkeyboard date power}

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm

[settings]
screenchange-reload = true
pseudo-transparency = false
