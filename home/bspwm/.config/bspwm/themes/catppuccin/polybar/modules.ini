[module/menu]
type = custom/text
format = 󰣇
format-font = 2
format-foreground = ${color.ACCENT}
format-padding = 1
click-left = $HOME/.config/bspwm/scripts/bspwm-rofi drun
click-right = $HOME/.config/bspwm/scripts/bspwm-rofi run

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false
fuzzy-match = true

; Workspace names are Nerd Font application glyphs. Preserve the actual name
; and use the shared Pink accent as the focus indicator.
label-focused = %name%
label-focused-font = 2
label-focused-foreground = ${color.ACCENT}
label-focused-padding = 2

label-occupied = %name%
label-occupied-font = 2
label-occupied-foreground = ${color.FOREGROUND}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-font = 2
label-urgent-background = ${color.RED}
label-urgent-foreground = ${color.BACKGROUND}
label-urgent-padding = 2

label-empty = %name%
label-empty-font = 2
label-empty-foreground = ${color.ALTBLACK}
label-empty-padding = 2

label-monocle = monocle
label-tiled = tiled
label-floating = floating
label-pseudotiled = pseudo
label-locked = 
label-sticky = 󰐃
label-private = 󰌾
label-marked = 󰄬

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.YELLOW}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.MAGENTA}
label = %used%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
warn-percentage = 90
format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${color.BLUE}
label-mounted = %used%
format-warn = <label-warn>
format-warn-prefix = "󰋊 "
format-warn-prefix-font = 2
format-warn-prefix-foreground = ${color.RED}
label-warn = %used%
label-warn-foreground = ${color.RED}
format-unmounted =

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${color.WHITE}

[module/player]
type = custom/script
exec = $HOME/.config/bspwm/scripts/polybar-media
exec-if = command -v playerctl
interval = 2
format-foreground = ${color.GREEN}
click-left = playerctl --player=playerctld play-pause
click-right = playerctl --player=playerctld stop
scroll-up = playerctl --player=playerctld next
scroll-down = playerctl --player=playerctld previous

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2
format-volume = <ramp-volume><label-volume>
format-volume-foreground = ${color.GREEN}
label-volume = " %percentage%%"
label-muted = %{T2}󰖁%{T-} muted
label-muted-foreground = ${color.ALTBLACK}
ramp-volume-font = 2
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${color.GREEN}
click-right = bspwm-volume mute
scroll-up = bspwm-volume up
scroll-down = bspwm-volume down

[module/bluetooth]
type = custom/script
exec = $HOME/.config/bspwm/scripts/polybar-bluetooth
interval = 5
format-foreground = ${color.BLUE}

[module/wired-network]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
label-connected = %{T2}󰈀%{T-} %downspeed%
label-connected-foreground = ${color.YELLOW}
format-disconnected =

[module/wireless-network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
label-connected = %{T2}󰖩%{T-} %signal%%
label-connected-foreground = ${color.YELLOW}
format-disconnected = <label-disconnected>
label-disconnected = %{T2}󰖪%{T-}
label-disconnected-foreground = ${color.ALTBLACK}

[module/backlight]
type = internal/backlight
use-actual-brightness = true
format = <ramp> <label>
label = %percentage%%
ramp-font = 2
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${color.YELLOW}
scroll-up = bspwm-brightness up
scroll-down = bspwm-brightness down

[module/battery]
type = internal/battery
battery = ${env:BSPWM_BATTERY:}
adapter = ${env:BSPWM_ADAPTER:}
full-at = 98
low-at = 15
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = %{T2}󰁹%{T-} <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-font = 2
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
animation-charging-0 = 󰢟
animation-charging-1 = 󰂆
animation-charging-font = 2
animation-charging-framerate = 750
format-charging-foreground = ${color.CYAN}
format-discharging-foreground = ${color.CYAN}
format-full-foreground = ${color.CYAN}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.MAGENTA}
label-layout = %layout%

[module/power]
type = custom/text
format = 
format-font = 2
format-foreground = ${color.RED}
click-left = $HOME/.config/bspwm/scripts/bspwm-rofi power

[module/tray]
type = internal/tray
format = <tray>
format-margin = 4px
tray-size = 65%
tray-spacing = 4px
